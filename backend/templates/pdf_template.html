<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Code Document</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            padding: 20px;
            color: #333;
        }

        h1 {
            font-size: 24px;
            color: #222;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .meta {
            font-size: 12px;
            color: #666;
            margin-bottom: 30px;
        }

        .code-block {
            margin-bottom: 40px;
            page-break-inside: avoid;
        }

        .code-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #444;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .description-box {
            background: #eef6ff;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

            {
                {
                /* {{ highlight_css | safe }} - Removed in favor of inline styles */
            }
        }

        /* Override Pygments CSS for PDF layout */
        .source {
            background: #f8f8f8;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            /* Ensure full width */
            box-sizing: border-box;
            /* Include padding/border in width */
        }

        .source pre {
            margin: 0;
            padding: 10px;
            font-size: 11px;
            font-family: 'Fira Code', 'Courier New', monospace;
            white-space: pre-wrap;
            /* Wrap long lines */
            word-wrap: break-word;
            /* Break long words */
            overflow-wrap: break-word;
            /* Standard property */
            line-height: 1.4;
            /* Improve readability */
        }

        /* Pygments Table Layout Styles */
        .source table {
            width: 100%;
            border-spacing: 0;
            border-collapse: collapse;
        }

        .source td.linenos {
            width: 40px;
            text-align: right;
            border-right: 1px solid #ddd;
            padding-right: 10px;
            vertical-align: top;
            user-select: none;
            /* Helpful for some viewers */
            padding-top: 10px;
            /* Match code padding */
        }

        .source td.code {
            padding-left: 10px;
            vertical-align: top;
            width: 100%;
            padding-top: 10px;
            /* Match code padding */
        }

        .source pre {
            margin: 0;
            padding: 0;
            /* padding handled by td */
            font-size: 11px;
            font-family: 'Fira Code', 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .source .linenos {
            color: #888;
            margin-right: 15px;
            /* Space between number and code */
            user-select: none;
            display: inline-block;
            /* Ensure spacing behaves */
            text-align: right;
            min-width: 25px;
            /* Align numbers */
        }

        .uncopyable-ln::before {
            content: attr(data-ln);
            /* Ensure it looks like the original line number */
            /* Inherited styles handle color/padding */
        }

        /* Previous linenos class might be redundant if we replaced content, but safe to keep styles */
        .source span.uncopyable-ln {
            /* Remove text selection for the container too, just in case */
            user-select: none;
            display: inline-block;
            min-width: 25px;
            text-align: right;
        }

        @page {
            margin: 1cm;
            size: A4;
        }
    </style>
</head>

<body>
    <h1>{{ title }}</h1>
    <div class="meta">{{ date }}</div>

    {% for item in items %}
    <div class="code-block">
        <div class="code-title">{{ item.filename }} ({{ item.language }})</div>
        {% if item.description %}
        <div class="description-box">
            <strong>AI Description:</strong><br>
            {{ item.description }}
        </div>
        {% endif %}
        <div class="source-container">
            {{ item.highlighted_code | safe }}
        </div>
    </div>
    {% endfor %}
</body>

</html>
